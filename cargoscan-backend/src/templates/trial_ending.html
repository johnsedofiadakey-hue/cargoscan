<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; color: #333; line-height: 1.6; }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 5px; }
    .header { font-size: 24px; font-weight: bold; color: #004b87; margin-bottom: 20px; }
    .button { display: inline-block; background-color: #004b87; color: white !important; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin: 20px 0; }
    .footer { font-size: 12px; color: #777; margin-top: 40px; border-top: 1px solid #ddd; padding-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Your CargoScan Trial is Ending Soon</div>
    <p>Hi {{name}},</p>
    <p>Your CargoScan trial will expire in {{daysLeft}} days.</p>
    <p>Upgrade to a paid plan to continue using all features without interruption.</p>
    <p><a href="{{upgradeUrl}}" class="button">Upgrade Now</a></p>
    <div class="footer">
      &copy; 2026 CargoScan. All rights reserved.
    </div>
  </div>
</body>
</html>
